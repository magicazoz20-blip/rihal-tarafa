<script>
const lessons=[
{id:'poet',unit:'01 / الشاعر',title:'فتى بكر الذي سبق عمره',subtitle:'طرفة بن العبد: سيرة شاعرٍ جعل من قصر الحياة اتساعاً في التجربة.',minutes:7,icon:'◈',intro:'في أخبار الجاهلية يطلّ طرفة شاباً جريئاً، سريع الموهبة، ترك قصيدةً تكشف عن حسٍّ حاد بالحياة ومفارقاتها.',sections:[['اسمه ونسبه','هو طرفة بن العبد بن سفيان بن سعد البكري الوائلي، من بكر بن وائل. واسمه في أكثر الروايات عمرو، أما «طرفة» فلقب غلب عليه. ينتمي إلى بيتٍ عرف الشعر؛ فخاله المتلمّس شاعر، وأخته الخرنق شاعرة.'],['القبيلة والبيئة','نشأ في مجتمع قبلي في شرق الجزيرة العربية، في فضاء البحرين التاريخية وما جاورها. كانت القبيلة إطار الحماية والهوية، وكانت الصلات بين بطون بكر وتغلب جزءاً من محيطه السياسي والاجتماعي.'],['النشأة والشخصية','تروي كتب الأخبار أنه نشأ يتيماً، وأنه عرف التوتر مع بعض أقاربه وشعر بالتقصير في حقه. تبرز في شعره شخصية معتدة بنفسها، ساخرة أحياناً، مقبلة على اللذة والكرم، لكنها واعية بقصر العمر وتقلب الأيام. وتبقى تفاصيل السيرة القديمة مزيجاً من الرواية التاريخية والأخبار الأدبية.'],['الوفاة','تجعل الروايات المشهورة مقتله شاباً نحو منتصف القرن السادس الميلادي، وتربط ذلك برسالة حملها إلى عاملٍ في بلاط الحيرة. تختلف الأخبار في التفاصيل والتأريخ؛ لذلك لا يُتعامل معها كوقائع يقينية.'],['ما الذي بقي؟','بقيت معلقته أشهر آثاره، وبقي صوته متميزاً بوصف الناقة، وبالتأمل في الزمن والموت، وبنبرة فتية تجمع الاعتداد والشكوى.'] ]},
{id:'era',unit:'02 / السياق',title:'العصر الجاهلي: عالم القصيدة',subtitle:'قراءة في المجتمع والثقافة والأسواق التي ازدهر فيها الشعر قبل الإسلام.',minutes:8,icon:'⌂',intro:'«الجاهلية» اسم اصطلاحي للفترة السابقة للإسلام، لا يعني خلوّها من المعرفة أو القيم؛ ففيها لغة وذاكرة شعرية ونظم اجتماعي متنوع.',sections:[['المجتمع والحياة','غلبت القبيلة على تنظيم جانب كبير من الحياة في الجزيرة: تنظم الحماية والموارد والتحالفات. وإلى جانب البداوة والرعي، عرفت مناطق الواحات والمدن والزراعة والتجارة والطرق البحرية. لذلك لا يصح اختزال المجتمع كله في صورة واحدة.'],['الثقافة الشفوية','كان الحفظ والرواية وسيلتين أساسيتين لنقل الشعر والأخبار والأنساب. امتلكت العربية الفصحى الشعرية تقاليد راسخة، مع اختلاف اللهجات والبيئات.'],['مكانة الشعر','حفظ الشعر أخبار الجماعة ومفاخرها وتجارب أفرادها، وكان الشاعر لساناً مؤثراً في المدح والهجاء والوصف. وتُقرأ القصيدة أيضاً بوصفها عملاً فنياً، لا وثيقة حرفية لكل تفاصيل الحياة.'],['الأسواق ومواسم اللقاء','ارتبطت أسواق مثل عكاظ ومجنة وذي المجاز في الروايات بمواسم التجارة واللقاء والخطابة والشعر. أما صورة المسابقات المحكمة وتعليق القصائد فيجب التعامل معها بحذر؛ فالروايات في نشأة المعلقات وسبب تسميتها متعددة.'],['الشعراء والرواة','من الأسماء البارزة امرؤ القيس وزهير بن أبي سلمى والنابغة الذبياني والأعشى ولبيد وعمرو بن كلثوم وعنترة وطرفة. وصلت نصوصهم عبر رواة ونسخ وشروح، ولذلك تظهر فروق بين الروايات.'] ]},
{id:'poetry',unit:'03 / الفن',title:'كيف تُبنى القصيدة الجاهلية؟',subtitle:'من الوقوف على الديار إلى مشهد الرحلة، ومن الوزن إلى الصورة.',minutes:8,icon:'〽',intro:'ليست القصيدة الجاهلية قالباً جامداً، لكنها كثيراً ما تبني تجربة ممتدة عبر مشاهد تنتقل من الذكرى إلى الرحلة ثم إلى غرض القصيدة.',sections:[['مفهوم الشعر الجاهلي','هو الشعر العربي المنسوب إلى الفترة السابقة للإسلام، وقد جُمع ورُوي في عصور لاحقة. يجمع بين تقاليد شفوية وصنعة لغوية دقيقة، وتُدرس نصوصه مع الانتباه إلى الرواية والنقل.'],['ملامح فنية','لغة مكثفة، صور حسية متصلة بالبيئة، إيقاع عروضي وقافية، وحركة بين المشهد والوصف والحكمة. تختلف هذه السمات من شاعر إلى آخر.'],['أغراض القصيدة','من أغراضه الغزل، والمدح، والهجاء، والفخر، والرثاء، والوصف، والحكمة. وقد يجمع النص الواحد أكثر من غرض أو نبرة.'],['البناء المألوف','يبدأ كثير من القصائد بذكر الديار والوقوف عليها، ثم ينتقل إلى وصف الرحلة والراحلة، وبعدها إلى غرض رئيسي كالفخر أو المدح. هذا وصف لاتجاه شائع لا قاعدة تلزم كل قصيدة.'],['الوزن والقافية','ينظم الشعر على أوزان إيقاعية، وتلتزم القصيدة غالباً قافية موحدة. معلقة طرفة من البحر الطويل ورويّها الدال في الرواية المشهورة؛ وهذا يمنح امتدادها نبرة متماسكة.'] ]},
{id:'muallaqat',unit:'04 / المعلقات',title:'قصائد صارت علامات',subtitle:'المعلقات بين شهرة النصوص وتعدد الروايات حول أسمائها وعددها.',minutes:7,icon:'✧',intro:'تُطلق المعلقات على مجموعة من القصائد الجاهلية الطويلة المختارة. مكانتها راسخة، أما تفسير الاسم والعدد فلهما روايات واختلاف.',sections:[['ما المعلقات؟','مجموعة من عيون القصائد الجاهلية، حفظتها كتب الاختيارات والشروح. شاع عدّها سبعاً، وتضيف بعض القوائم قصائد أخرى لتصبح تسعاً أو عشراً.'],['التسمية: رواية ونقاش','اشتهرت قصة كتابتها بماء الذهب وتعليقها على الكعبة، لكن الباحثين ناقشوا سند هذه الرواية. ويربط بعض الدارسين الاسم بجودة القصائد ونفاستها أو بكونها «علائق» تعلق بالذاكرة. لا تُعرض قصة التعليق بوصفها حقيقة محسومة.'],['أصحاب السبع المشهورة','امرؤ القيس، طرفة بن العبد، زهير بن أبي سلمى، لبيد بن ربيعة، عمرو بن كلثوم، عنترة بن شداد، والحارث بن حلزة. وتختلف قوائم أخرى فتذكر النابغة أو الأعشى بدلاً من بعض الأسماء.'],['خصائصها ومكانتها','طول النفس، تنوع الموضوعات، قوة التصوير والإيقاع، واتساع تمثيلها للتجربة القبلية والفردية. صارت نصوصاً مركزية في دراسة العربية والشعر القديم، مع ضرورة ملاحظة اختلاف الروايات والشروح.'],['معلقة طرفة','تبدأ بذكر خولة وديارها، ثم تتسع إلى الرحلة ووصف الناقة، وتظهر فيها ذات الشاعر وكرمه ونظرته إلى الموت والزمن. ليست موضوعاتها وحدات منفصلة تماماً؛ بل تتجاوب داخل صوت واحد.'] ]},
{id:'muallaqa',unit:'05 / قراءة',title:'داخل معلقة طرفة',subtitle:'قصيدة طويلة تجمع الطلل والرحلة ووصف الناقة والحكمة في صوتٍ واحد.',minutes:11,icon:'❧',intro:'معلقة طرفة ليست مجرد تعداد لأغراض الشعر؛ إن حركة القصيدة تجعل وصف الناقة والحديث عن الذات جزءاً من مواجهة الشاعر للهم والزمن.',sections:[['المطلع والطلل','«لِخَوْلَةَ أَطْلَالٌ بِبُرْقَةِ ثَهْمَدِ / تَلُوحُ كَبَاقِي الوَشْمِ فِي ظَاهِرِ اليَدِ». يستحضر الديار الباقية كما يبقى الوشم، صورة تجعل الذاكرة أثراً مرئياً على الجسد.'],['الرحلة والناقة','يطيل الشاعر في وصف ناقته، فيبرز سرعتها وقوتها ودقة أعضائها. الناقة ليست زينة وصفية فقط؛ إنها وسيلة الحركة وتجاوز الهم، وفي تشبيهاتها يستعرض الشاعر مهارته في تحويل المشاهدة إلى صورة.'],['الغزل والفخر','يظهر ذكر خولة في المطلع ضمن تقليد الوقوف على الديار، ثم تتبدل نبرة القصيدة. ويفخر طرفة بكرمه وشجاعته وإغاثته، لكن الفخر عنده يرتبط أيضاً باختياراته الفردية وأسلوبه في الحياة.'],['الحكمة والتأمل','«سَتُبْدِي لَكَ الأَيَّامُ مَا كُنْتَ جَاهِلًا / وَيَأْتِيكَ بِالأَخْبَارِ مَنْ لَمْ تُزَوِّدِ». تجعل الأيام نفسها كاشفةً لما غاب، وتلخص ثقة التجربة بقدرتها على كشف الحقائق.'],['مفردات من المطلع','الأطلال: آثار الديار بعد رحيل أهلها. برقة ثهمد: موضع تذكره رواية القصيدة. تلوح: تظهر من بعيد. الوشم: أثر ثابت على ظاهر اليد.'],['صورة وتشبيه','يشبه أثر الديار ببقية الوشم على ظاهر اليد؛ تشبيه محسوس يقرّب فكرة بقاء أثر الحب بعد زوال المكان. وفي وصف الناقة تتوالى التشبيهات لتجعل حركتها وقوتها مرئيتين للسامع.'],['قراءة واعية بالرواية','تختلف بعض ألفاظ الأبيات وترتيبها في نسخ الديوان والشروح. الأبيات المعروضة هنا شواهد قصيرة من الرواية المتداولة، وينبغي الرجوع إلى طبعة محققة عند الدراسة النصية.'] ]},
{id:'craft',unit:'06 / الصنعة',title:'ملامح صوت طرفة',subtitle:'لغة حسية وإيقاع ممتد، وشخصية شعرية تواجه مصيرها بجرأة.',minutes:8,icon:'✺',intro:'تتجلى خصوصية طرفة في الجمع بين دقة الوصف وقوة الحضور الشخصي، وبين متعة العيش والوعي بأن الحياة لا تدوم.',sections:[['اللغة والأسلوب','يميل إلى ألفاظ حسية دقيقة حين يصف الراحلة، وإلى عبارات موجزة ذات نبرة تقريرية حين يحكم على الأيام. ينتقل بين السرد والوصف والنداء والحوار.'],['الصورة الفنية','تنبني صوره على التشبيه والمقابلة والتجسيد. صورة الأطلال كالوشم تحول المكان البعيد إلى أثر في الجسد؛ وفي وصف الناقة تتتابع صور الحركة والصلابة.'],['الموسيقى','البحر الطويل والقافية الموحدة يمنحان المعلقة امتداداً مناسباً للمشهد الرحلي. تتولد الموسيقى من الوزن والقافية، ومن تكرار الأصوات وتوازن التراكيب.'],['العاطفة والشخصية','في القصيدة اعتداد بالنفس وحساسية تجاه الإهمال والظلم، واندفاع إلى الكرم واللذة. لكن نبرة المتعة ليست غفلة؛ إذ تصاحبها معرفة حادة بالموت وتقلب الزمن.'],['كيف نقرأه؟','اسأل: من المتكلم؟ كيف يتحول المشهد؟ ما الصورة التي تبقى في الذهن؟ وأين يتحول الوصف إلى موقف من الحياة؟ بهذه الأسئلة يصبح البيت تجربة قابلة للتحليل لا معلومة للحفظ فقط.'] ]}
];
const games=[{id:'quiz',icon:'◉',title:'تحدي المعرفة',desc:'خمسة أسئلة، وأربع فرص لكل إجابة.',kind:'quiz'},{id:'truefalse',icon:'◐',title:'صح أم خطأ',desc:'اختبر حدسك وصحّح الفكرة فوراً.',kind:'tf'},{id:'complete',icon:'✎',title:'أكمل العبارة',desc:'اختر الكلمة التي تعيد البيت أو المعلومة إلى مكانها.',kind:'complete'},{id:'poet',icon:'♧',title:'من صاحب المعلقة؟',desc:'اكتشف الشاعر من مطلع قصيدته.',kind:'poet'},{id:'memory',icon:'▦',title:'تحدي الذاكرة',desc:'طابق المصطلح الأدبي مع تعريفه.',kind:'memory'}];
const data={xp:0,completed:[],games:0,correct:0,answered:0,achievements:[],activity:[],last:null,sound:false};let state=Object.assign(data,JSON.parse(localStorage.getItem('rihal-v1')||'{}'));let currentPage='home';let soundCtx;
const levels=[['مبتدئ',0],['محب للأدب',100],['مستكشف الشعر',250],['فارس المعلقات',500],['خبير الأدب الجاهلي',850],['أسطورة الشعر العربي',1300]];function level(){let i=0;levels.forEach((x,n)=>{if(state.xp>=x[1])i=n});return {i,name:levels[i][0],start:levels[i][1],next:levels[i+1]?.[1]??levels[i][1]}}function save(){localStorage.setItem('rihal-v1',JSON.stringify(state));updateShell()}function updateShell(){let l=level(),pct=l.next?Math.min(100,(state.xp-l.start)/(l.next-l.start)*100):100;document.getElementById('side-level').textContent=l.name;document.getElementById('side-xp').textContent=state.xp+' XP';document.getElementById('side-bar').style.width=pct+'%';document.getElementById('side-next').textContent=l.next?`${l.next-state.xp} نقطة للمستوى التالي`:'بلغت القمة';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){let t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.append(t);setTimeout(()=>t.remove(),2800)}function addXP(n,why){let old=level().i;state.xp+=n;let now=level().i;save();toast(`<b>+${n} XP</b>　${why}`);if(now>old)setTimeout(()=>modal('✦','ارتقيت إلى مستوى جديد',`أصبحت الآن <strong>${levels[now][0]}</strong>. تابع رحلتك واكتشف المزيد.`),450);play('success')}
function modal(icon,title,txt){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div class="badge">${icon}</div><h2>${title}</h2><p class="muted">${txt}</p><button class="btn" onclick="this.closest('.modal').remove()">متابعة</button></div>`;document.body.append(m)}function unlock(id){if(state.achievements.includes(id))return;state.achievements.push(id);save();let a=achievements.find(x=>x.id===id);if(a)setTimeout(()=>modal(a.icon,'إنجاز جديد',`<strong>${a.title}</strong><br>${a.desc}`),250)}const achievements=[{id:'first',icon:'✦',title:'أول خطوة',desc:'أكملت أول درس.'},{id:'reader',icon:'▤',title:'قارئ متميز',desc:'أكملت خمسة دروس.'},{id:'perfect',icon:'♛',title:'عقل ذهبي',desc:'حققت العلامة الكاملة في لعبة.'},{id:'knight',icon:'⚔',title:'فارس المعلقات',desc:'أنهيت درس المعلقات.'},{id:'expert',icon:'✺',title:'خبير طرفة',desc:'أكملت جميع الدروس.'}];function completeLesson(id){if(state.completed.includes(id))return;state.completed.push(id);state.last=id;state.activity.unshift({text:'أكمل درس '+lessons.find(x=>x.id===id).title,icon:'✓',time:new Date().toLocaleDateString('ar')});addXP(20,'إكمال درس');if(state.completed.length===1)unlock('first');if(state.completed.length>=5)unlock('reader');if(id==='muallaqat')unlock('knight');if(state.completed.length===lessons.length)unlock('expert');save()}
function page(p){currentPage=p;updateShell();document.getElementById('crumb').textContent='رحلتك الأدبية / '+({home:'الرئيسية',library:'المكتبة',games:'ساحة التحدي',profile:'ملفي'}[p]||'قراءة الدرس');render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let c=document.getElementById('content');c.innerHTML='';if(currentPage==='home')home(c);else if(currentPage==='library')library(c);else if(currentPage==='games')gamesPage(c);else if(currentPage==='profile')profile(c);else if(currentPage.startsWith('lesson:'))lesson(c,currentPage.split(':')[1]);else if(currentPage.startsWith('game:'))playGame(c,currentPage.split(':')[1])}
function home(c){let done=state.completed.length,pct=Math.round(done/lessons.length*100),last=lessons.find(x=>x.id===state.last)||lessons[0],l=level();c.innerHTML=`<div class="eyebrow">مساء المعرفة · رحلة أدبية تفاعلية</div><section class="hero"><div class="hero-copy"><div class="eyebrow">الوجهة الحالية · العصر الجاهلي</div><h1>أهلاً بك في<br><span>عالم طرفة</span></h1><p class="subhead">من أثر الديار إلى صوت الحكمة. اقترب من شاعرٍ رأى الحياة قصيرةً بما يكفي ليعيشها بكل اتساع.</p><div class="hero-actions"><button class="btn" onclick="page('lesson:${last.id}')">${state.last?'تابع من حيث وصلت':'ابدأ أول درس'}　←</button><button class="btn btn-ghost" onclick="page('library')">تصفّح المكتبة</button></div></div><div class="scene"><div class="sun"></div><div class="ridge back"></div><div class="ridge"></div><div class="tent"></div><div class="camel">♞</div><i class="dust"></i><i class="dust"></i><i class="dust"></i><i class="dust"></i><i class="dust"></i></div></section><div class="stats"><div class="stat"><small>مستواك الحالي</small><strong style="font-size:19px">${l.name}</strong></div><div class="stat"><small>الرصيد الأدبي</small><strong>${state.xp}<small style="color:var(--gold)"> XP</small></strong></div><div class="stat"><small>دروس مكتملة</small><strong>${done}<small style="color:var(--muted)"> / ${lessons.length}</small></strong></div><div class="stat"><small>الإنجازات</small><strong>${state.achievements.length}<small style="color:var(--muted)"> / ${achievements.length}</small></strong></div></div><div class="section-head"><div><div class="eyebrow">طريقك إلى القصيدة</div><h2>محطات الرحلة</h2></div><button class="btn btn-ghost btn-small" onclick="page('library')">عرض المكتبة ←</button></div><div class="grid grid-3">${lessons.slice(0,3).map(card).join('')}</div><div class="feature" style="margin-top:19px"><div class="panel feature-card"><div class="eyebrow">لحظة من المعلقة</div><div class="quote">سَتُبْدِي لَكَ الأَيَّامُ مَا كُنْتَ جَاهِلًا<br>وَيَأْتِيكَ بِالأَخْبَارِ مَنْ لَمْ تُزَوِّدِ<small>طرفه بن العبد · من المعلقة، بروايتها المشهورة</small></div></div><div class="panel feature-card"><div class="eyebrow">الساحة مفتوحة</div><h3>المعرفة تحبّ التحدي</h3><p>جولات قصيرة بخمس ألعاب مختلفة. اختبر ما تعلمت، واجمع نقاطاً تفتح لك مستويات جديدة.</p><button class="btn btn-small" onclick="page('games')">دخول ساحة التحدي　↗</button></div></div><div class="section-head"><h2>مراجع القراءة</h2><span class="pill">نصوص وشروح موثوقة</span></div><div class="panel" style="font-size:12px;color:var(--muted)">اعتمدت المادة على روايات الديوان وشروح المعلقة، مع التنبيه إلى اختلاف الأخبار والأبيات. <a href="https://www.bibliotheque.nat.tn/BNTK/doc/SYRACUSE/6230199" target="_blank" rel="noreferrer">ديوان طرفة، تحقيق درية الخطيب ولطفي الصقال</a> · <a href="https://direct.ksu.edu.sa/entities/journalarticle/9df55ffd-509d-4f57-88d0-faf81efb8f73" target="_blank" rel="noreferrer">قراءة في معلقة طرفة، جامعة الملك سعود</a> · <a href="https://downloads.hindawi.org/books/25316290.pdf" target="_blank" rel="noreferrer">موسوعة تاريخ الأدب العربي</a></div>`}
function card(x){return `<article class="panel lesson-card" onclick="page('lesson:${x.id}')"><div class="row"><span class="lesson-no">${x.unit}</span><span class="pill">${state.completed.includes(x.id)?'مكتمل':x.minutes+' دقائق'}</span></div><h3>${x.title}</h3><p>${x.subtitle}</p><div class="card-foot"><b>${state.completed.includes(x.id)?'✓ تمت القراءة':'ابدأ القراءة'}</b><span>${x.icon}　↗</span></div></article>`}function library(c){c.innerHTML=`<div class="eyebrow">المكتبة الأدبية</div><h1>ستة أبواب إلى <span style="color:var(--gold)">عالم القصيدة</span></h1><p class="subhead">تعلّم على مهل. كل محطة حكاية صغيرة، وكل حكاية تفتح باباً إلى المعلقة.</p><div class="section-head"><div><div class="eyebrow">مسار القراءة</div><h2>من الشاعر إلى صناعته</h2></div><span class="pill">${state.completed.length} / ${lessons.length} مكتمل</span></div><div class="grid grid-2">${lessons.map(card).join('')}</div><div class="section-head"><h2>مراجع ومصادر</h2></div><div class="grid grid-2"><a class="panel" target="_blank" href="https://www.bibliotheque.nat.tn/BNTK/doc/SYRACUSE/6230199"><b>ديوان طرفة بن العبد</b><p class="muted">شرح الأعلم الشنتمري، تحقيق درية الخطيب ولطفي الصقال، مجمع اللغة العربية بدمشق.</p></a><a class="panel" target="_blank" href="https://direct.ksu.edu.sa/entities/journalarticle/9df55ffd-509d-4f57-88d0-faf81efb8f73"><b>قراءة في معلقة طرفة بن العبد</b><p class="muted">أنور أبو سويلم، مجلة العلوم، دار جامعة الملك سعود للنشر.</p></a><a class="panel" target="_blank" href="https://downloads.hindawi.org/books/25316290.pdf"><b>موسوعة تاريخ الأدب العربي</b><p class="muted">مدخل موسوعي إلى الشعر القديم وتاريخ جمع المعلقات.</p></a><a class="panel" target="_blank" href="https://islamansiklopedisi.org.tr/tarafe-b-abd"><b>طرفة بن العبد · TDV İslâm Ansiklopedisi</b><p class="muted">مدخل بحثي عن الشاعر وأخباره ورواية المعلقة.</p></a></div>`}
function lesson(c,id){let x=lessons.find(y=>y.id===id);if(!x){page('library');return}c.innerHTML=`<div class="row" style="margin-bottom:25px"><button class="btn btn-ghost btn-small" onclick="page('library')">← العودة إلى المكتبة</button><span class="pill">${x.unit} · ${x.minutes} دقائق</span></div><div class="lesson-layout"><aside class="lesson-toc panel"><div class="eyebrow">في هذا الدرس</div>${x.sections.map((s,i)=>`<button onclick="document.getElementById('sec${i}').scrollIntoView({behavior:'smooth'})">${s[0]}</button>`).join('')}<div class="divider"></div><button onclick="page('games')">✧ اختبر معرفتك</button></aside><article class="lesson-body"><div class="eyebrow">${x.unit}</div><h1>${x.title}</h1><p class="subhead">${x.subtitle}</p><div class="panel" style="margin:25px 0"><div class="eyebrow">تمهيد</div><p style="margin:8px 0 0;color:#d4c6a9">${x.intro}</p></div>${x.sections.map((s,i)=>`<section id="sec${i}" class="reveal"><h2>${s[0]}</h2><p>${s[1]}</p>${id==='muallaqa'&&i===0?'<div class="verse">لِخَوْلَةَ أَطْلَالٌ بِبُرْقَةِ ثَهْمَدِ<br>تَلُوحُ كَبَاقِي الوَشْمِ فِي ظَاهِرِ اليَدِ<small>معلقة طرفة · مطلع القصيدة</small></div>':''}${id==='muallaqa'&&i===3?'<div class="verse">سَتُبْدِي لَكَ الأَيَّامُ مَا كُنْتَ جَاهِلًا<br>وَيَأْتِيكَ بِالأَخْبَارِ مَنْ لَمْ تُزَوِّدِ<small>معلقة طرفة · رواية الديوان المشهورة</small></div>':''}</section>`).join('')}<div class="definition"><b>تذكّر:</b> وصلت إلينا القصائد عبر روايات متعددة؛ قد تختلف بعض الألفاظ أو ترتيب الأبيات بين الطبعات.</div><div class="row" style="margin-top:28px"><button class="btn btn-ghost" onclick="page('library')">المكتبة</button><button class="btn" onclick="completeLesson('${id}');toast('تم حفظ تقدّمك في هذا الدرس')">${state.completed.includes(id)?'أُكمل هذا الدرس ✓':'أنهيت الدرس +20 XP'}</button></div><div class="divider"></div><div class="row"><button class="btn btn-ghost btn-small" onclick="lessonNav('${id}',-1)">→ الدرس السابق</button><button class="btn btn-ghost btn-small" onclick="lessonNav('${id}',1)">الدرس التالي ←</button></div><p class="muted" style="font-size:11px;margin-top:25px">مراجع: <a href="https://www.bibliotheque.nat.tn/BNTK/doc/SYRACUSE/6230199" target="_blank">ديوان طرفة، تحقيق الخطيب والصقال</a> · <a href="https://direct.ksu.edu.sa/entities/journalarticle/9df55ffd-509d-4f57-88d0-faf81efb8f73" target="_blank">قراءة في معلقة طرفة، جامعة الملك سعود</a></p></article></div>`}function lessonNav(id,d){let i=lessons.findIndex(x=>x.id===id);page('lesson:'+lessons[(i+d+lessons.length)%lessons.length].id)}
function gamesPage(c){c.innerHTML=`<div class="eyebrow">ساحة التحدي</div><h1>هل تصغي <span style="color:var(--gold)">للقصيدة؟</span></h1><p class="subhead">اختر لعبتك. كل جولة قصيرة، وكل إجابة صحيحة تقرّبك من مستوى جديد.</p><div class="stats"><div class="stat"><small>الجولات المكتملة</small><strong>${state.games}</strong></div><div class="stat"><small>إجابات صحيحة</small><strong>${state.correct}</strong></div><div class="stat"><small>معدل الدقة</small><strong>${state.answered?Math.round(state.correct/state.answered*100):0}%</strong></div><div class="stat"><small>نقاطك</small><strong>${state.xp} XP</strong></div></div><div class="grid grid-3">${games.map(g=>`<article class="panel game-tile" onclick="page('game:${g.id}')"><div class="game-glyph">${g.icon}</div><h3>${g.title}</h3><p>${g.desc}</p><div class="card-foot"><b>العب الآن</b><span>↗</span></div></article>`).join('')}</div><div class="panel" style="margin-top:18px"><div class="eyebrow">اقتراح الرحلة</div><p style="margin:8px 0 0">اقرأ محطة من المكتبة أولاً، ثم عد لتختبر ما بقي في الذاكرة.</p><button class="btn btn-ghost btn-small" onclick="page('library')">إلى المكتبة ←</button></div>`}
const qs=[{q:'إلى أي قبيلة يُنسب طرفة بن العبد؟',o:['بكر بن وائل','تغلب بن وائل','تميم','قريش'],a:0,e:'طرفة من بكر بن وائل.'},{q:'بماذا شبّه طرفة بقايا الديار في مطلع معلقته؟',o:['بالنجوم','بباقي الوشم على اليد','بأطلال القصر','برسم المطر'],a:1,e:'قال: تلوح كباقي الوشم في ظاهر اليد.'},{q:'ما البحر الذي تُروى عليه معلقة طرفة؟',o:['الكامل','البسيط','الطويل','الوافر'],a:2,e:'المعلقة من البحر الطويل في الرواية المشهورة.'},{q:'أي مشهد يستغرق حيزاً بارزاً في معلقة طرفة؟',o:['وصف الناقة','وصف البحر','رثاء أخ','مدح ملك'],a:0,e:'يُفرد طرفة مساحة واسعة لوصف ناقته.'},{q:'ما القافية المشهورة لمعلقة طرفة؟',o:['الميم','الدال','اللام','النون'],a:1,e:'رويّ المعلقة الدال.'},{q:'ما العبارة الأدق عن عدد المعلقات؟',o:['سبع دائماً بلا خلاف','اختلفت القوائم بين سبع وغيرها','اثنتا عشرة','قصيدتان'],a:1,e:'اشتهرت السبع، مع قوائم أوسع في بعض الروايات.'},{q:'في أي موضع ينسب طرفة إلى بكر بن وائل؟',o:['قبيلته','مدرسته','سوقه','ديوانه'],a:0,e:'بكر بن وائل هي قبيلته.'},{q:'ما موضوع صورة الوشم في المطلع؟',o:['الزينة فقط','بقاء أثر الديار','المدح','الحرب'],a:1,e:'تقرّب صورة الوشم أثر المكان الباقي في الذاكرة.'}];const tfs=[{q:'تُنسب معلقة طرفة إلى البحر الطويل.',a:true,e:'صحيح؛ وهي على الطويل في الرواية المشهورة.'},{q:'اتفق الباحثون على أن القصائد علّقت فعلاً على الكعبة.',a:false,e:'الرواية موضع نقاش ولا تُعد حقيقة محسومة.'},{q:'طرفة من شعراء بكر بن وائل.',a:true,e:'صحيح.'},{q:'لا تتناول معلقة طرفة إلا غرض الغزل.',a:false,e:'تضم الطلل والرحلة والوصف والفخر والحكمة.'},{q:'تختلف الروايات أحياناً في ألفاظ الشعر القديم.',a:true,e:'صحيح، لذلك ينبغي الرجوع إلى طبعة محققة.'}];const comps=[{q:'لخولة أطلال ببرقة ___',o:['ثهمد','عكاظ','تهامة'],a:0},{q:'تلوح كباقي الوشم في ظاهر ___',o:['السيف','اليد','القلب'],a:1},{q:'ستبدي لك الأيام ما كنت ___',o:['جاهلاً','ناسياً','راجياً'],a:0},{q:'ويأتيك بالأخبار من لم ___',o:['تزود','تشهد','تسافر'],a:0},{q:'طرفة شاعر من بكر بن ___',o:['وائل','تميم','أسد'],a:0}];const poets=[{q:'«قِفا نبكِ من ذكرى حبيبٍ ومنزلِ»',a:'امرؤ القيس'},{q:'«أمن أم أوفى دمنة لم تكلمِ»',a:'زهير بن أبي سلمى'},{q:'«لخولة أطلال ببرقة ثهمدِ»',a:'طرفة بن العبد'},{q:'«هل غادر الشعراء من متردمِ»',a:'عنترة بن شداد'},{q:'«عفت الديار محلها فمقامها»',a:'لبيد بن ربيعة'}];function sample(arr,n){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function playGame(c,id){if(id==='memory'){memory(c);return}let type={quiz:qs,truefalse:tfs,complete:comps,poet:poets}[id];if(!type){page('games');return}let q=sample(type,5),idx=0,score=0,locked=false;let title=games.find(g=>g.id===id).title;c.innerHTML=`<button class="btn btn-ghost btn-small" onclick="page('games')">← الساحة</button><div class="gamebox panel"><div class="row"><div><div class="eyebrow">جولة قصيرة</div><h2>${title}</h2></div><span class="question-count" id="qcount">1 / 5</span></div><div class="bar"><i id="gamebar" style="width:20%"></i></div><div id="qarea"></div></div>`;function draw(){locked=false;let item=q[idx],area=document.getElementById('qarea');document.getElementById('qcount').textContent=`${idx+1} / 5`;document.getElementById('gamebar').style.width=((idx+1)*20)+'%';let opts=id==='truefalse'?['صح','خطأ']:id==='poet'?['طرفة بن العبد','امرؤ القيس','زهير بن أبي سلمى','عنترة بن شداد']:item.o;area.innerHTML=`<p style="font:27px/1.8 var(--serif);margin-top:22px">${item.q}</p><div class="answers">${opts.map((o,i)=>`<button class="answer" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="row"><span class="muted" style="font-size:11px">الإجابة الصحيحة تمنحك 10 XP</span><button class="btn btn-small" id="next" style="display:none">${idx===4?'النتيجة':'التالي ←'}</button></div>`;area.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.i,b))}function choose(i,b){if(locked)return;locked=true;let item=q[idx],ans=id==='truefalse'?(item.a?0:1):id==='poet'?['طرفة بن العبد','امرؤ القيس','زهير بن أبي سلمى','عنترة بن شداد'].indexOf(item.a):item.a;let ok=i===ans;b.classList.add(ok?'correct':'wrong');if(ok){score++;state.correct++;state.answered++;addXP(10,'إجابة صحيحة')}else{state.answered++;document.querySelectorAll('.answer')[ans]?.classList.add('correct');play('wrong')}document.getElementById('feedback').textContent=(ok?'أحسنت! ':'')+item.e;save();let n=document.getElementById('next');n.style.display='inline-block';n.onclick=()=>{idx++;if(idx<5)draw();else finish()}}function finish(){state.games++;state.activity.unshift({text:'أنجز لعبة '+title,icon:'✧',time:new Date().toLocaleDateString('ar')});addXP(15,'إكمال الجولة');if(score===5){addXP(20,'مكافأة العلامة الكاملة');unlock('perfect')}save();c.innerHTML=`<div class="gamebox panel" style="text-align:center;padding:40px"><div class="eyebrow" style="justify-content:center">انتهت الجولة</div><div style="font:72px var(--serif);color:var(--gold);margin:10px">${score}<small style="font:20px var(--sans);color:var(--muted)"> / 5</small></div><h2>${score===5?'يا لها من ذاكرة!':score>=3?'أداء جميل':'بداية موفقة'}</h2><p class="muted">حصلت على ${score*10+15+(score===5?20:0)} XP في هذه الجولة.</p><button class="btn" onclick="page('games')">العودة إلى الألعاب</button>　<button class="btn btn-ghost" onclick="page('game:${id}')">جولة أخرى</button></div>`}draw()}
function memory(c){let pairs=[['الطلل','أثر الديار بعد رحيل أهلها'],['المعلقة','قصيدة جاهلية طويلة مشهورة'],['القافية','الصوت المتكرر في أواخر الأبيات'],['البحر الطويل','وزن معلقة طرفة المشهور']];let deck=[];pairs.forEach((p,i)=>{deck.push({pair:i,text:p[0]},{pair:i,text:p[1]})});deck.sort(()=>Math.random()-.5);c.innerHTML=`<button class="btn btn-ghost btn-small" onclick="page('games')">← الساحة</button><div class="gamebox panel"><div class="row"><div><div class="eyebrow">ذاكرة ومطابقة</div><h2>صل المصطلح بمعناه</h2></div><span class="pill" id="mcount">0 / 4</span></div><p class="muted">اختر بطاقتين في كل مرة. ستُكشف لك المصطلحات في هذه الجولة.</p><div class="memory-grid">${deck.map((x,i)=>`<button class="memory-card" data-i="${i}">؟</button>`).join('')}</div><div class="feedback" id="mfeedback"></div></div>`;let open=[],matched=0,moves=0,busy=false;c.querySelectorAll('.memory-card').forEach((b,i)=>b.onclick=()=>{if(busy||b.classList.contains('matched')||open.includes(i))return;b.classList.add('open');b.textContent=deck[i].text;open.push(i);if(open.length===2){moves++;state.answered++;save();let [a,z]=open;if(deck[a].pair===deck[z].pair){state.correct++;[a,z].forEach(j=>{let el=c.querySelector(`[data-i="${j}"]`);el.classList.add('matched');el.classList.remove('open')});matched++;open=[];document.getElementById('mcount').textContent=`${matched} / 4`;addXP(10,'مطابقة صحيحة');if(matched===4){state.games++;state.activity.unshift({text:'أنجز لعبة تحدي الذاكرة',icon:'▦',time:new Date().toLocaleDateString('ar')});addXP(15,'إكمال اللعبة');save();setTimeout(()=>modal('▦','اكتملت المطابقة',`أنهيت التحدي في ${moves} محاولات.`),250)}}else{busy=true;document.getElementById('mfeedback').textContent='ليست مطابقة؛ حاول أن تتذكر موضع كل بطاقة.';setTimeout(()=>{[a,z].forEach(j=>{let el=c.querySelector(`[data-i="${j}"]`);el.classList.remove('open');el.textContent='؟'});open=[];busy=false},850)}}})}
function profile(c){let l=level(),pct=l.next?Math.min(100,(state.xp-l.start)/(l.next-l.start)*100):100;c.innerHTML=`<div class="eyebrow">مساحتك الشخصية</div><h1>ملف <span style="color:var(--gold)">الرحلة</span></h1><div class="panel profile-head"><div class="big-avatar">ط</div><div style="flex:1"><div class="eyebrow">مستواك الحالي</div><h2 style="margin:2px 0">${l.name}</h2><span class="muted">قارئٌ يتتبع أثر القصيدة</span><div class="bar" style="height:6px;max-width:500px"><i style="width:${pct}%"></i></div><small class="muted">${state.xp} XP ${l.next?'· '+(l.next-state.xp)+' للمستوى التالي':'· بلغت أعلى مستوى'}</small></div></div><div class="stats"><div class="stat"><small>مجموع النقاط</small><strong>${state.xp}</strong></div><div class="stat"><small>الدروس المكتملة</small><strong>${state.completed.length}</strong></div><div class="stat"><small>الجولات</small><strong>${state.games}</strong></div><div class="stat"><small>نسبة الإجابات الصحيحة</small><strong>${state.answered?Math.round(state.correct/state.answered*100):0}%</strong></div></div><div class="grid grid-2"><section class="panel"><div class="section-head" style="margin-top:0"><h2>الإنجازات</h2><span class="pill">${state.achievements.length} / ${achievements.length}</span></div>${achievements.map(a=>`<div class="achievement ${state.achievements.includes(a.id)?'':'locked'}"><div class="badge">${a.icon}</div><div><b>${a.title}</b><small>${a.desc}</small></div>${state.achievements.includes(a.id)?'<span style="margin-right:auto;color:var(--gold)">✓</span>':''}</div>`).join('')}</section><section class="panel"><div class="section-head" style="margin-top:0"><h2>سجل الرحلة</h2><span class="pill">الأحدث أولاً</span></div>${state.activity.length?state.activity.slice(0,10).map(a=>`<div class="activity"><span style="color:var(--gold)">${a.icon}</span><span>${a.text}</span><small class="muted">${a.time}</small></div>`).join(''):'<div class="empty">ابدأ درساً أو لعبة لتظهر محطات رحلتك هنا.</div>'}</section></div><div class="panel" style="margin-top:17px"><div class="row"><div><div class="eyebrow">حفظ تلقائي</div><p class="muted" style="margin:4px 0 0">تُحفظ نقاطك وإنجازاتك على هذا الجهاز تلقائياً.</p></div><button class="btn btn-ghost btn-small" onclick="if(confirm('سيُحذف تقدمك المحفوظ على هذا الجهاز. هل تريد المتابعة؟')){localStorage.removeItem('rihal-v1');location.reload()}">إعادة ضبط التقدم</button></div></div>`}
function play(type){if(!state.sound)return;try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();let o=soundCtx.createOscillator(),g=soundCtx.createGain();o.connect(g);g.connect(soundCtx.destination);o.frequency.value=type==='success'?660:185;g.gain.setValueAtTime(.04,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+.13);o.start();o.stop(soundCtx.currentTime+.14)}catch{}}document.getElementById('sound').onclick=e=>{state.sound=!state.sound;e.currentTarget.classList.toggle('sound-on',state.sound);e.currentTarget.title=state.sound?'الصوت مفعّل':'تفعيل الصوت';save();toast(state.sound?'تم تفعيل أصوات الإجابة':'تم إيقاف الأصوات')};document.getElementById('help').onclick=()=>modal('ر','أهلاً بك في رِحال','منصة قراءة تفاعلية تتبع طرفة بن العبد ومعلقته. تعلّم، العب، واجمع XP؛ تقدمك محفوظ على هذا الجهاز.');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));document.getElementById('start').onclick=document.getElementById('skip').onclick=()=>{document.getElementById('intro').classList.add('hide');page('home')};updateShell();render();
</script></body></html>
